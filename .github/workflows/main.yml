name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install ClawHub
        run: npx clawhub@latest install verified-agent-identity

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Create Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: node scripts/manualLinkHumanToAgent.js --challenge '{"name":"benyindra","description":"benyindra AI Agent"}'
